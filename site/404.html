<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090b">
<title>Страница не найдена · F1 Timeline</title>
<link rel="icon" href="/f1-timeline/icons/favicon.svg" type="image/svg+xml">
<style>
:root {
  --red: #e10600;
  --red-glow: rgba(225, 6, 0, 0.4);
  --bg: #08090b;
  --text: #f4f6f8;
  --muted: #a4adba;
  --panel: #111318;
  --border: #262b33;
}
@font-face { font-family: 'Exo 2'; font-style: normal; font-weight: 500 900; font-display: swap;
  src: url('/f1-timeline/assets/exo2-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Exo 2'; font-style: normal; font-weight: 500 900; font-display: swap;
  src: url('/f1-timeline/assets/exo2-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+2212; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 'Exo 2', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 24px;
}
header.pit-header {
  width: 100%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}
.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--red), #800000);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-style: italic;
  color: #fff;
  letter-spacing: -0.04em;
  box-shadow: 0 4px 14px var(--red-glow);
  clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
  user-select: none;
}
.brand b { font-size: 14px; letter-spacing: 0.08em; display: block; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
main {
  flex: 1;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 0;
}
.lights {
  display: inline-flex;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 999px;
  background: #14171c;
  border: 1px solid var(--border);
  margin-bottom: 28px;
}
.lights i {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 16px rgba(225, 6, 0, 0.7);
  animation: out 3.2s infinite;
}
.lights i:nth-child(2) { animation-delay: .12s; }
.lights i:nth-child(3) { animation-delay: .24s; }
.lights i:nth-child(4) { animation-delay: .36s; }
.lights i:nth-child(5) { animation-delay: .48s; }
@keyframes out { 0%, 55% { background: var(--red); box-shadow: 0 0 16px rgba(225, 6, 0, 0.7); } 62%, 100% { background: #2a0c0b; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .lights i { animation: none; } }
.code { font-size: clamp(72px, 22vw, 148px); font-weight: 900; line-height: 1; letter-spacing: -.04em; color: var(--red); font-variant-numeric: tabular-nums; }
h1 { font-size: clamp(22px, 5vw, 30px); font-weight: 900; margin: 10px 0 8px; text-wrap: balance; }
p { color: var(--muted); margin: 0 0 26px; text-wrap: pretty; }
a.btn {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0 24px;
  border-radius: 12px;
  background: var(--red);
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  transition: transform .15s ease, box-shadow .15s ease;
}
a.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--red-glow);
}
:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 3px;
}
nav { margin-top: 24px; display: flex; gap: 8px 18px; flex-wrap: wrap; justify-content: center; }
nav a { color: var(--text); min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
nav a:hover { color: var(--red); }
</style>
</head>
<body>
<header class="pit-header" role="banner">
  <a class="brand" href="/f1-timeline/" aria-label="F1 Timeline: на главную">
    <div class="brand-mark">F1</div>
    <div>
      <b translate="no">F1 TIMELINE</b>
      <small>Пит-уолл и аналитика гонок</small>
    </div>
  </a>
</header>
<main>
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="code">404</div>
  <h1>Такой страницы на трассе нет</h1>
  <p>Адрес изменился или в нём опечатка. Данные сайта на месте: начните с обзора сезона.</p>
  <a class="btn" href="/f1-timeline/">На главную</a>
  <nav aria-label="Разделы">
    <a href="/f1-timeline/standings/">Турнир</a>
    <a href="/f1-timeline/calendar/">Календарь</a>
    <a href="/f1-timeline/drivers/">Пилоты</a>
    <a href="/f1-timeline/teams/">Команды</a>
  </nav>
</main>
</body>
</html>
